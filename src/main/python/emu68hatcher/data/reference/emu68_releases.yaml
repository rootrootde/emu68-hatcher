# Emu68 releases the builder knows about. Single source for the desktop download
# table (builder/host/download_catalog.py) and the kernel names written into
# config.txt (builder/staging/scripts/generator.py); scripts/export-emu68-releases.py
# turns it into emu68-releases-v1.json for the native tools.
#
# assets:
#   role      download state key, also the cache subdirectory name
#   kind      zip = boot archive extracted onto the FAT partition
#             raw = single file copied as-is (VideoCore.card)
#   url/size/sha256  exact GitHub release asset. All values below were computed
#             from downloaded bytes on 2026-10-09 and match the sha256 digest
#             GitHub reports for the asset. Use null for anything not checked
#             that way - never fill in a guess.
# kernels: file names config.txt boots per board family. modern = PiStorm32-lite
#   and PiStorm16 builds, classic = original PiStorm. The pistorm16 mapping is
#   inherited from the builder and is not hardware-verified.
#
# The bare Raspberry Pi archive (Emu68-raspi.zip) is not listed on purpose: it
# does not boot an Amiga.

schema_version: 1
repository: michalsc/Emu68

releases:
