# package bundles: groups of packages presented as a single checkbox in the GUI.
# members declare membership via `bundle: <id>` in their own YAML.
# bundle-level default wins over member `default:` flags.

toolsdaemon:
  display_name: ToolsDaemon 2.2
  group: Commodities
  description: Custom Workbench menus and preferences editor
  default: true

whdload:
  display_name: WHDLoad
  group: Games
  description: WHDLoad with the Emu68 wrapper and RTB files
  default: true

image_datatypes:
  display_name: Image datatypes
  group: Datatypes
  description: akGIF, akJFIF (JPEG), akPNG and akTIFF image datatypes
  default: true

hippoplayer:
  display_name: HippoPlayer
  group: Applications
  description: "MOD and other tracker module player"
  default: true

picasso96:
  display_name: Picasso96
  group: RTG
  description: "picasso96 RTG driver (shareware) + amiga-blitter disable patch"
  default: true

magicmenu:
  display_name: MagicMenu
  group: Commodities
  description: "intuition menu enhancer 3.1"
  default: false

fonts_workbench:
  display_name: Workbench fonts
  group: Fonts
  description: "Apparent, Dina and Terminus bitmap fonts"
  default: false

fonts_magicwb:
  display_name: MagicWB fonts
  group: Fonts
  description: "XEN, XHelvetica and XCourier"
  default: false

fonts_retro:
  display_name: Retro fonts
  group: Fonts
  description: "TopazPro, proptopaz, Topaz/TopazPlus, MicroKnight, P0T-NOoDLE and mOsOul"
  default: false

fonts_scalable:
  display_name: Scalable fonts
  group: Fonts
  description: "Bitstream Vera, DejaVu and Roboto TrueType families"
  default: false
