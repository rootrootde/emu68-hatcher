name: prism2
friendly_name: Prism2
group: System
description: 'WirelessManager for wifipi.device'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
mandatory: false
# prism2 2.8 with WirelessManager 1.3: the 1.5 in aminet's 2.9 leaves the AP
# address unset on wifipi.device, so the WPA handshake fails
download:
  source: local
  path: Prism2v2.lha
  filename: Prism2v2.lha
install:
- from: prism2v2/C/WirelessManager
  to: C/
- from: prism2v2/C/wpa_passphrase
  to: C/
