name: amitcp_ng
friendly_name: AmiTCP_NG
group: Network
description: 'open TCP/IP stack with Roadshow-compatible commands'
upstream_version: '4.1.8'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
requires:
- network_config
provides:
- tcpip_stack
conflicts:
- tcpip_stack
download:
  source: github
  repo: MW0MWZ/AmiTCP_NG
  tag: v4.1.8
  filename: AmiTCP_NG-v4.1.8.lha
  hash: 02C3C528BA699B984894C292CD043E62
install:
- from: AmiTCP_NG/data/Libs/bsdsocket.library
  to: Libs/
- from: AmiTCP_NG/data/Libs/usergroup.library
  to: Libs/
- from: AmiTCP_NG/data/C/*
  to: C/
- from: AmiTCP_NG/data/Devs/Internet/*
  to: Devs/Internet/
- from: AmiTCP_NG/data/Storage/NetInterfaces/genet
  to: Devs/NetInterfaces/
- from: AmiTCP_NG/data/Storage/NetInterfaces/wifipi
  to: Devs/NetInterfaces/
- from: AmiTCP_NG/data/S/Network-Startup
  to: S/
- from: AmiTCP_NG/data/db/*
  to: Programs/AmiTCP/db/
- from: AmiTCP_NG/COPYING
  to: Programs/AmiTCP/
- from: AmiTCP_NG/COPYRIGHTS
  to: Programs/AmiTCP/
- from: AmiTCP_NG/ReadMe
  to: Programs/AmiTCP/
- from: AmiTCP_NG/ReadMe.info
  to: Programs/AmiTCP/
- from: AmiTCP_NG.info
  to: Programs/
  rename: AmiTCP.info
scripts:
- name: AmiTCP_NG
  content: |
    Assign >NIL: AmiTCP: SYS:Programs/AmiTCP
    If EXISTS C:GetNetStatus
      Run >NIL: <NIL: C:GetNetStatus >NIL:
    EndIf
