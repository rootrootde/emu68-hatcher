name: setdst
friendly_name: SetDST
group: Utilities
description: 'Adjust the system clock for daylight saving time'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
mandatory: false
download:
  source: aminet
  path: util/time/SetDST.lha
  hash: EF32E16790F81AAF5AB8DDC1A60E372B
  filename: SetDST.lha
install:
- from: SetDST-*/C/*
  to: C/
- from: SetDST-*/SetDST
  to: C/
scripts:
- name: SetDST
  content: |
    If Exists C:SetDST
      C:SetDST NOASK NOREQ QUIET >NIL:
    EndIf
default: true
