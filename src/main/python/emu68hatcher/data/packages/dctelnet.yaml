name: dctelnet
friendly_name: DCTelnet
group: Internet
description: 'telnet client'
upstream_version: '1.10'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
default: false
# the reqtools package replaces the reqtools.library in the archive
requires:
- reqtools
download:
  source: github
  repo: bruno-frederic/dctelnet
  tag: v1.10
  hash: 490362339e12f4609592e70c1d0244c0
  filename: DCTelnet-v1.10.lha
install:
# 68020 build only; Emu68 is a 68040-class CPU
- from: DCTelnet/DCTelnet.020
  to: Programs/DCTelnet/
  rename: DCTelnet
# no stack patch: upstream ships 4096 and names Roadshow as supported
- from: DCTelnet/DCTelnet.020.info
  to: Programs/DCTelnet/
  rename: DCTelnet.info
- from: DCTelnet/DCTelnet.Book
  to: Programs/DCTelnet/
- from: DCTelnet/DCTelnet.Book.info
  to: Programs/DCTelnet/
- from: DCTelnet/Docs/*
  to: Programs/DCTelnet/Docs/
- from: DCTelnet/SCIcons/*
  to: Programs/DCTelnet/SCIcons/
- from: DCTelnet/WBIcons/*
  to: Programs/DCTelnet/WBIcons/
- from: DCTelnet/Devs/ibmcon.device
  to: Devs/
- from: DCTelnet/Libs/xprftp.library
  to: Libs/
- from: DCTelnet/Libs/xprzmodem.library
  to: Libs/
- from: DCTelnet/Libs/xemvt340.library
  to: Libs/
- from: DCTelnet/Fonts/*
  to: Fonts/
menu_entry:
  title: DCTelnet
  path: Programs/DCTelnet/DCTelnet
  menu: Network
  wb_launch: true
