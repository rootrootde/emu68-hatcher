name: telser
friendly_name: Telser
group: Network
description: 'serial device over telnet (telser.device) for terminal programs'
upstream_version: '1.40'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
default: false
requires:
- telser_keyfile
download:
  source: aminet
  path: comm/tcp/telser140.lha
  hash: 82c5be34544118b54c6b04f88961ff98
  filename: telser140.lha
install:
- from: telser/bin/*
  to: Programs/Telser/bin/
- from: telser/db/*
  to: Programs/Telser/db/
- from: telser/doc/*
  to: Programs/Telser/doc/
- from: telser/serv/telserd_amitcp
  to: Programs/Telser/serv/
  rename: telserd
- from: telser/devs/telser.device_amitcp
  to: Devs/
  rename: telser.device
- from: telser/libs/rawin.library
  to: Libs/
# the device stub hardcodes AmiTCP:bin/telser
scripts:
- name: telser
  content: |
    Assign AmiTCP: SYS:Programs/Telser ADD
menu_entry:
  title: Telser Config
  path: Programs/Telser/bin/tsconfig
  menu: Network
  wb_launch: true
