name: miamidx_support
friendly_name: MiamiDX Support
group: System
description: 'MiamiDX connection tools and GENET settings'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
download:
  source: local
install:
- from: System/S/MiamiNetwork.rexx
  to: S/
- from: System/Prefs/Env-Archive/genet_Miami.prefs
  to: Prefs/Env-Archive/
  rename: genet.prefs
- from: System/Utilities/MiamiDX Network Config
  to: Utilities/
  rename: Network Config
- from: System/Utilities/Network Config.info
  to: Utilities/
- from: System/Utilities/Connect MiamiDX WiFi
  to: Utilities/
  rename: Connect WiFi
- from: System/Utilities/Connect WiFi.info
  to: Utilities/
- from: System/Utilities/Connect MiamiDX Ethernet
  to: Utilities/
  rename: Connect Ethernet
- from: System/Utilities/Connect Ethernet.info
  to: Utilities/
- from: System/Utilities/Disconnect MiamiDX
  to: Utilities/
  rename: Disconnect
- from: System/Utilities/Network Config.info
  to: Utilities/
  rename: Disconnect.info
requires:
- rexxreqtools
- ethernet_driver
- emu68_wifi
