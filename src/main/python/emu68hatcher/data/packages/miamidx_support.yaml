name: miamidx_support
friendly_name: MiamiDX Support
group: System
description: 'MiamiDX GENET settings and the Network Settings icon'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
download:
  source: local
install:
# MiamiNetwork.rexx has no launcher any more; kept as a Shell fallback
# (rx S:MiamiNetwork.rexx CONFIG|OFFLINE, rx S:MiamiNetwork.rexx ONLINE GENET|WIFIPI)
- from: System/S/MiamiNetwork.rexx
  to: S/
- from: System/Prefs/Env-Archive/genet_Miami.prefs
  to: Prefs/Env-Archive/
  rename: genet.prefs
- from: System/Utilities/Network Settings
  to: Utilities/
- from: System/Utilities/Network Settings.info
  to: Utilities/
  stack: 65536
requires:
- hatcher_prefs
# only the fallback script still needs rexxreqtools; drop both together
- rexxreqtools
- ethernet_driver
- emu68_wifi
