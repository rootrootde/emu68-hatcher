name: aatext
friendly_name: AAText
group: Appearance
description: 'antialiased TrueType text on RTG screens (editor: Prefs/AATextPrefs)'
upstream_version: '0.46'
default: false
versions:
- '3.2'
- 3.2.2.1
- 3.2.3
# FirstBoot registers FONTS:TrueType with AATextManager when it exists; ttfinstall's
# character cells are too big for AAText
requires:
- aatext_config
- fonts_dejavu
# aminet lags behind the github releases
download:
  source: github
  repo: Sdursun/AAText
  tag: v0.46
  hash: 140ABE387801647C21C8CA953C927755
  filename: AAText.lha
install:
- from: AAText/AAText
  to: C/
# the Fonts button in AATextPrefs starts SYS:System/AATextManager
- from: AAText/AATextManager
  to: System/
- from: AAText/AATextManager.info
  to: System/
- from: AAText/Libs/freetype2.library
  to: Libs/
- from: AAText/AATextPrefs
  to: Prefs/
- from: AAText/AATextPrefs.info
  to: Prefs/
# must run before LoadWB opens any window, so not WBStartup; the installer puts it after IPrefs
scripts:
- name: AAText
  target: S/Startup-Sequence
  after: '^(?:C:)?IPrefs(?:\s|$)'
  content: |
    Run >NIL: C:AAText
