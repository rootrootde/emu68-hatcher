name: ttflib
friendly_name: ttf.library
group: System
description: 'TrueType font engine 0.8.5 for 68040+, installed with TrueType fonts'
download:
  source: aminet
  path: util/libs/ttflib68040.lha
  hash: 11697f9995edb72c3439d810ca299c54
  filename: ttflib68040.lha
install:
- from: ttflib68040_0.85.lha/ttflib68040/ttf.library
  to: Libs/
- from: ttflib68040_0.85.lha/ttflib68040/ttfinstall
  to: C/
scripts:
- name: TrueType fonts
  content: |
    IF NOT EXISTS S:Hatcher-Fonts.done
      IF EXISTS FONTS:TrueType
        FailAt 21
        C:Echo "Registering TrueType fonts..."
        C:ttfinstall "FONTS:TrueType/#?.ttf" FONTS:
        IF WARN
          C:Echo "Font registration failed. It will be retried on the next boot."
        ELSE
          C:Echo >S:Hatcher-Fonts.done "TRUE"
        ENDIF
        FailAt 10
      ENDIF
    ENDIF
