name: cfd
friendly_name: CompactFlash.device
group: Drivers
description: 'compactflash PCMCIA driver'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
default: true
download:
  source: github
  repo: pulchart/cfd
  tag: v20261007
  hash: 9F317F5658C49866D7458866ED5143E2
  filename: cfd.v20261007.lha
install:
# small (no debug) / 68020+ tier; the device now needs ptable.library beside it
- from: cfd/small/68020/devs/compactflash.device
  to: Devs/
- from: cfd/small/68020/libs/ptable.library
  to: Libs/
- from: cfd/c/*
  to: C/
# Devs/DOSDrivers auto-mounts at boot; Storage/DOSDrivers stays inactive
- from: cfd/Storage/DOSDrivers/CF0
  to: Devs/DOSDrivers/
- from: cfd/Storage/DOSDrivers/CF0.info
  to: Devs/DOSDrivers/
requires:
- fat95
