name: hid2ami
friendly_name: HID2AMI Mouse Wheel Driver
group: Drivers
description: 'mouse wheel support (firmware 3.0.0+)'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
default: false
download:
  source: web
  url: https://raw.githubusercontent.com/EmberHeavyIndustries/HID2AMI/faf72c40f998a1fadbb46edbc19f1a4def65b4c7/Firmware/Hid2Ami.lha
  hash: A502D5E9F4AE2E71F036157C441EF92F
  filename: Hid2Ami.lha
install:
- from: Hid2Ami/HID2AmiDriver
  to: C/
  # the driver signals wheel-up by letting the adapter pull the left button line low inside
  # its vblank server (priority 0, behind gameport.device's). lowlevel.library 47 replaces
  # gameport's server with its own at the end of the priority-0 group as soon as a program
  # calls SetJoyPortAttrs (AGS2 does), so the buttons are then sampled right after the pulse
  # and every wheel-up becomes a left click until reboot. ln_Pri of the driver's Interrupt
  # (symbol _vertblankint, data hunk 2 offset 17) set to -10 keeps it behind both.
  patch:
  - offset: 0x11b1
    expect: 0x00
    value: 0xf6

# the vendor Installer emits Run" <>NIL:" (InstallerGen escaping artifact) and
# wrong filename case; the script below uses the corrected form
scripts:
- name: HID2AMI Mouse Wheel
  content: |
    ;BEGIN HID2AMI
    If $System EQ "PiStorm"
      If Exists C:HID2AmiDriver
        Run <>NIL: C:HID2AmiDriver
      EndIf
    EndIf
    ;END HID2AMI
