name: network_config
friendly_name: Network Settings
group: System
description: 'shared network settings and the Network Settings icon'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
download:
  source: local
install:
# NetworkConfig.rexx has no launcher any more; kept as a Shell fallback
# (rx S:NetworkConfig.rexx, rx S:NetworkConfig.rexx ONLINE WIFI|ETHERNET) and for
# the licensed Roadshow boot-time SYNCTIME call
- from: System/S/NetworkConfig.rexx
  to: S/
- from: System/Utilities/Network Settings
  to: Utilities/
- from: System/Utilities/Network Settings.info
  to: Utilities/
  stack: 65536
requires:
- hatcher_prefs
# only the fallback script still needs rexxreqtools; drop both together
- rexxreqtools
- ethernet_driver
- emu68_wifi
