name: network_config
friendly_name: Network Config
group: System
description: 'shared network settings and the Hatcher-Prefs launcher'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
download:
  source: local
install:
# NetworkConfig.rexx is no longer a launcher; kept one release as a Shell fallback
# (rx S:NetworkConfig.rexx, rx S:NetworkConfig.rexx ONLINE WIFI|ETHERNET) and for
# the licensed Roadshow boot-time SYNCTIME call. hatcher-prefs' migration checks
# its exact bytes, so do not edit it.
- from: System/S/NetworkConfig.rexx
  to: S/
- from: System/Utilities/Network Config
  to: Utilities/
- from: System/Utilities/Network Config.info
  to: Utilities/
  stack: 65536
requires:
- hatcher_prefs
# only the fallback script still needs rexxreqtools; drop both together
- rexxreqtools
- ethernet_driver
- emu68_wifi
