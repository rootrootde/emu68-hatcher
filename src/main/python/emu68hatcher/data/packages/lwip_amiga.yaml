name: lwip_amiga
friendly_name: lwip-amiga
group: Network
description: 'fast open TCP/IP stack from the Emu68 driver stack (netdev genet, Roadshow-compatible commands)'
upstream_version: '1.6'
versions:
- '3.2'
- 3.2.2.1
- 3.2.3
emu68_versions:
- 1.1.0-alpha.1
- 1.1.0-beta.1
archive_package: emu68_driver_stack
requires:
- genet_config
- network_config
- wifipi_config
provides:
- tcpip_stack
conflicts:
- tcpip_stack
install:
- from: LIBS/bsdsocket.library
  to: Libs/
# netdev genet.device: only this stack can open it. install order puts
# emu68_ethernet (a dependency via network_config) first, so this copy wins
- from: DEVS/Networks/genet.device
  to: Devs/Networks/
- from: C/AddNetInterface
  to: C/
- from: C/RemoveNetInterface
  to: C/
- from: C/NetShutdown
  to: C/
- from: C/GetNetStatus
  to: C/
- from: C/ShowNetStatus
  to: C/
- from: C/arp
  to: C/
- from: C/ping
  to: C/
- from: C/traceroute
  to: C/
- from: C/netinfo
  to: C/
- from: C/netdev-stats
  to: C/
- from: C/mdns
  to: C/
- from: C/NetLogViewer
  to: C/
- from: C/NetLogViewer.info
  to: C/
- from: C/NetSpeed
  to: C/
- from: C/NetSpeed.info
  to: C/
- from: ENVARC/netstack.prefs.default
  to: Prefs/Env-Archive/
- from: ENVARC/netstack.prefs.default
  to: Prefs/Env-Archive/
  rename: netstack.prefs
- from: Documentation/lwip-amiga/README.md
  to: Programs/lwip-amiga/
- from: Documentation/lwip-amiga/RELEASE-NOTES.md
  to: Programs/lwip-amiga/
- from: Documentation/lwip-amiga/LICENSE
  to: Programs/lwip-amiga/
# lwip adds interfaces only through AddNetInterface and allows one at a time;
# Hatcher-Prefs BOOT reads the choice from ENVARC:Hatcher-NetBoot
scripts:
- name: lwip-amiga TCP/IP
  content: |
    ;BEGIN lwip-amiga
    If NOT EXISTS S:Network-disabled
      If EXISTS C:Hatcher-Prefs
        Run >NIL: C:Hatcher-Prefs BOOT
      EndIf
    EndIf
    ;END lwip-amiga
