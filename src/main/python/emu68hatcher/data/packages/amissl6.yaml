name: amissl6
friendly_name: AmiSSL v6
group: Libraries
description: 'TLS/SSL library, v6 on top of v5'
upstream_version: '6.1'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
mandatory: false
# v5 programs (AmiMAIL) still need the v5 libraries; the v6 amisslmaster serves both
requires:
- amissl
download:
  source: github
  repo: jens-maus/amissl
  tag: '6.1'
  hash: C289503E7547D1A71966F13245C59AFC
  filename: AmiSSL-6.1-OS3.lha
install:
- from: AmiSSL/Libs/AmigaOS3/amisslmaster.library
  to: Programs/AmiSSL/Libs/
- from: AmiSSL/Libs/AmigaOS3/AmiSSL/68020-40/amissl_v*.library
  to: Programs/AmiSSL/Libs/AmiSSL/
- from: AmiSSL/Certs/*
  to: Programs/AmiSSL/Certs/
default: false
