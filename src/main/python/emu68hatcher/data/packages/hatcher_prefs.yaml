name: hatcher_prefs
friendly_name: Hatcher Prefs
group: Utilities
description: 'network settings window: connect, disconnect, WiFi password, addresses'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
# archive synced from the hatcher-prefs repo by scripts/sync-native-tools.py
download:
  source: local
  path: Hatcher-Prefs.lha
  filename: Hatcher-Prefs.lha
install:
# the Network Settings icon and the Network menu name SYS:C/Hatcher-Prefs
- from: Hatcher-Prefs/Hatcher-Prefs
  to: C/
- from: Hatcher-Prefs
  to: Emu68-Hatcher/Tools/
  recursive: true
# the Network menu carries the launcher (configure_menus), so no menu_entry here
default: true
# MUI draws the window; the Shell entry Hatcher-Prefs CONNECT runs without it
requires:
- mui
