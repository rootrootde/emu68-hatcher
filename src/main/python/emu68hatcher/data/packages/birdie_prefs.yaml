name: birdie_prefs
friendly_name: Birdie Prefs
group: Appearance
description: 'MUI editor for the Birdie settings (editor: Prefs/BirdiePrefs)'
upstream_version: '1.31'
default: false
requires:
- birdie
- mui
download:
  source: aminet
  path: util/misc/bprefs.lha
  hash: 73a83ba5ac9cbfdad9a4b081ca49e81d
  filename: bprefs.lha
# the icon is an IconX project: "Birdie Prefs" is a one-line script that runs
# bprefs from its own directory, so all three stay together under Prefs/
install:
- from: Birdie Prefs
  to: Prefs/
  rename: BirdiePrefs
- from: Birdie Prefs.info
  to: Prefs/
  rename: BirdiePrefs.info
- from: bprefs
  to: Prefs/
