# Reviewed archive pins for packages the Amiga package tool may install
# (native eligibility "supported"). Keyed by the package that downloads the
# archive. scripts/export-amiga-catalog.py refuses a supported package without
# an entry here and refuses an entry whose md5 differs from the package YAML,
# so a changed upstream file never picks up a new SHA-256 by itself. Update an
# entry only after checking the new archive's contents and every consumer's
# install rules; scripts/check-package-downloads.py verifies these values.
