name: Announce release on Discord

# announce only after the update manifest for a published release went out
on:
  workflow_run:
    workflows: ["Publish update manifest"]
    types: [completed]

jobs:
  announce:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/releases/latest > "$RUNNER_TEMP/release.json"
          payload=$(jq '(.name // "") as $title | {
              content: "@everyone  \($title)",
              allowed_mentions: { parse: ["everyone"] },
              embeds: [{
                title: $title,
                url: .html_url,
                description: ((.body // "")[:4000]),
                color: 5793266
              }]
            }' "$RUNNER_TEMP/release.json")
          curl -fsSL -X POST -H "Content-Type: application/json" \
            -d "$payload" "$WEBHOOK"
