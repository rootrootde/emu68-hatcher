name: Check package downloads

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: package-download-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Switch to the latest release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName -R "$GITHUB_REPOSITORY")
          git checkout "origin/${tag#v}" 2>/dev/null || git checkout "$tag"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pydantic pyyaml

      - name: Check package downloads
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/check-package-downloads.py --report "$RUNNER_TEMP/package-check.md"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write job summary
        if: always()
        run: cat "$RUNNER_TEMP/package-check.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ steps.check.outputs.status }}
        run: |
          title="package downloads need attention"
          issue=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "package downloads need attention") | .number' | head -n 1)
          report="$RUNNER_TEMP/package-check.md"

          if [ "$CHECK_STATUS" != "0" ]; then
            if [ -n "$issue" ]; then
              gh issue view "$issue" --json body --jq .body > "$RUNNER_TEMP/old-package-check.md"
              if ! cmp -s "$report" "$RUNNER_TEMP/old-package-check.md"; then
                gh issue edit "$issue" --body-file "$report"
                gh issue comment "$issue" --body "The package check results changed. The issue body has the current report."
              fi
            else
              gh issue create --title "$title" --body-file "$report"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "All configured package downloads pass again."
          fi

  # copies every pinned archive of main and the latest release branch to the archive mirror,
  # which the app falls back to when upstream replaces or drops a file
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out the latest release branch beside main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName -R "$GITHUB_REPOSITORY")
          git worktree add --detach "$RUNNER_TEMP/release" "origin/${tag#v}" 2>/dev/null \
            || git worktree add --detach "$RUNNER_TEMP/release" "$tag"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .

      - name: Mirror pinned archives
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_MIRROR_TOKEN }}
          MIRROR_REPO: rootrootde/emu68-hatcher-archives
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ARCHIVE_MIRROR_TOKEN is not set, nothing mirrored"
            exit 0
          fi
          gh release view archives -R "$MIRROR_REPO" --json assets --jq '.assets[].name' \
            > "$RUNNER_TEMP/mirrored.txt"
          packages=src/main/python/emu68hatcher/data/packages
          HATCHER_HOME="$RUNNER_TEMP/hatcher" python scripts/mirror-package-archives.py \
            --packages-dir "$packages" --packages-dir "$RUNNER_TEMP/release/$packages" \
            --existing "$RUNNER_TEMP/mirrored.txt" --out "$RUNNER_TEMP/mirror" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          shopt -s nullglob
          files=("$RUNNER_TEMP"/mirror/*)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload archives "${files[@]}" -R "$MIRROR_REPO"
          fi
